<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor 3D con Profundidad</title>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:system-ui}
#top{background:#111;padding:8px;border-bottom:1px solid #222}
button{padding:10px;border-radius:8px;border:0;font-weight:700;width:100%;margin-top:5px}
.primary{background:#00ff88;color:#000}.ghost{background:#222;color:#fff}
#canvasBox{width:100%;height:65vh;background:#00c800}
canvas{display:block;width:100%;height:100%}
#thumbs{display:flex;gap:6px;padding:6px;background:#111;overflow-x:auto}
.th{width:70px;height:70px;border:2px solid #333;border-radius:10px;background:#000;flex-shrink:0}
.th.active{border-color:#00ff88}
#zoomInfo{position:absolute;top:10px;right:10px;background:#000c;color:#00ff88;padding:4px 8px;border-radius:12px;font-size:11px;border:1px solid #00ff88}
</style>
</head>
<body>
<div id="top"><strong>EDITOR 3D - Sprites con Profundidad</strong>
<div style="display:flex;gap:6px">
<button class="ghost" id="btnTPose" style="width:25%">T-Pose</button>
<button class="ghost" id="btnIdle" style="width:25%">IDLE</button>
<button class="ghost" id="btnWalk" style="width:25%">WALK</button>
<button class="ghost" id="btnFight" style="width:25%">PELEA</button>
</div></div>
<div id="canvasBox" style="position:relative"><canvas id="c"></canvas><div id="zoomInfo">Zoom 1.0x</div></div>
<div id="thumbs"></div>
<div style="padding:8px;background:#111">
<button class="primary" id="export">EXPORTAR 4 DIR VERDE con PROFUNDIDAD</button>
<button class="ghost" id="btnZoomReset">Zoom 1x (vuelve solo)</button>
</div>
<script type="module">
import * as THREE from 'three';
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas, antialias:true});
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x00c800);
const camera=new THREE.PerspectiveCamera(35, canvas.clientWidth/canvas.clientHeight, 0.1, 100);
camera.position.set(0,1.2,3.5);
const light=new THREE.DirectionalLight(0xffffff,2); light.position.set(2,3,2); scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff,0.6));
const mat=new THREE.MeshToonMaterial({color:0xe8e8e8});
const outlineMat=new THREE.MeshBasicMaterial({color:0x000000, side:THREE.BackSide});
function createCapsule(len,radius){
  const g=new THREE.Group();
  const geo=new THREE.CapsuleGeometry(radius,len,4,8);
  const mesh=new THREE.Mesh(geo,mat);
  const outline=new THREE.Mesh(geo,outlineMat); outline.scale.set(1.08,1.08,1.08);
  g.add(outline); g.add(mesh); return g;
}
function createHuman(){
  const human=new THREE.Group();
  const hips=createCapsule(0.3,0.18); hips.position.y=0.9;
  const spine=createCapsule(0.35,0.16); spine.position.y=0.25; hips.add(spine);
  const chest=createCapsule(0.3,0.20); chest.position.y=0.35; spine.add(chest);
  const neck=createCapsule(0.15,0.08); neck.position.y=0.25; chest.add(neck);
  const headGeo=new THREE.SphereGeometry(0.22,16,16);
  const head=new THREE.Mesh(headGeo,mat);
  const headOutline=new THREE.Mesh(headGeo,outlineMat); headOutline.scale.set(1.12,1.12,1.12);
  const headGroup=new THREE.Group(); headGroup.add(headOutline); headGroup.add(head); headGroup.position.y=0.28; neck.add(headGroup);
  function arm(side){
    const sh=createCapsule(0.28,0.07); sh.position.set(side*0.28,0.05,0);
    const el=createCapsule(0.26,0.06); el.position.y=0.28; sh.add(el);
    const ha=new THREE.Mesh(new THREE.SphereGeometry(0.07),mat); ha.position.y=0.18; el.add(ha);
    chest.add(sh); return {sh,el};
  }
  const lArm=arm(-1), rArm=arm(1);
  function leg(side){
    const hip=createCapsule(0.32,0.10); hip.position.set(side*0.12,-0.25,0);
    const kn=createCapsule(0.30,0.09); kn.position.y=-0.35; hip.add(kn);
    const ft=new THREE.Mesh(new THREE.CapsuleGeometry(0.08,0.15),mat); ft.position.y=-0.25; ft.rotation.x=Math.PI/2; kn.add(ft);
    hips.add(hip); return {hip,kn};
  }
  const lLeg=leg(-1), rLeg=leg(1);
  human.add(hips); human._bones={hips,spine,chest,neck,head:headGroup,lArm,rArm,lLeg,rLeg};
  return human;
}
const human=createHuman(); scene.add(human);
function applyPose(type){
  const b=human._bones;
  if(type==='tpose'){ b.lArm.sh.rotation.set(0,0,-1.4); b.rArm.sh.rotation.set(0,0,1.4); b.lLeg.hip.rotation.set(0,0,-0.15); b.rLeg.hip.rotation.set(0,0,0.15); }
  else if(type==='idle'){ b.lArm.sh.rotation.set(0,0,-0.2); b.rArm.sh.rotation.set(0,0,0.2); b.chest.rotation.x=0.15; }
  else if(type==='walk'){ b.lArm.sh.rotation.set(0.8,0,0); b.rArm.sh.rotation.set(-0.8,0,0); b.lLeg.hip.rotation.set(-0.6,0,0); b.rLeg.hip.rotation.set(0.6,0,0); b.lLeg.kn.rotation.set(1.0,0,0); }
  else if(type==='fight'){ b.lArm.sh.rotation.set(0.5,0,-0.6); b.lArm.el.rotation.set(1.2,0,0); b.rArm.sh.rotation.set(0.3,0,0.8); b.rArm.el.rotation.set(1.0,0,0); b.lLeg.hip.rotation.set(-0.3,0,-0.2); b.rLeg.hip.rotation.set(0.2,0,0.2); b.lLeg.kn.rotation.set(0.8,0,0); }
}
applyPose('tpose');
let zoomLevel=3.5; let zoomTimeout=null;
function setZoom(z){ zoomLevel=Math.max(2,Math.min(5,z)); camera.position.z=zoomLevel; document.getElementById('zoomInfo').textContent='Zoom '+zoomLevel.toFixed(1)+'x'; clearTimeout(zoomTimeout); if(Math.abs(zoomLevel-3.5)>0.1){ zoomTimeout=setTimeout(()=>{ let start=zoomLevel; let t0=Date.now(); function anim(){ let t=(Date.now()-t0)/450; if(t>=1){zoomLevel=3.5; camera.position.z=3.5; return;} let e=1-Math.pow(1-t,3); camera.position.z=start+(3.5-start)*e; requestAnimationFrame(anim);} anim(); },1500); } }
function animate(){ requestAnimationFrame(animate); renderer.render(scene,camera); } animate();
document.getElementById('btnTPose').onclick=()=>applyPose('tpose');
document.getElementById('btnIdle').onclick=()=>applyPose('idle');
document.getElementById('btnWalk').onclick=()=>applyPose('walk');
document.getElementById('btnFight').onclick=()=>applyPose('fight');
document.getElementById('btnZoomReset').onclick=()=>setZoom(3.5);
canvas.addEventListener('wheel',(e)=>{ e.preventDefault(); setZoom(zoomLevel + (e.deltaY>0?0.15:-0.15)); }, {passive:false});
document.getElementById('export').onclick=()=>{
  const dirs=[0, Math.PI/2, Math.PI, 3*Math.PI/2];
  const tmpCanvas=document.createElement('canvas'); tmpCanvas.width=512; tmpCanvas.height=512;
  const tmpRenderer=new THREE.WebGLRenderer({canvas:tmpCanvas, antialias:true});
  const exportCanvas=document.createElement('canvas'); exportCanvas.width=2048; exportCanvas.height=512;
  const ctx2=exportCanvas.getContext('2d'); ctx2.fillStyle='#00c800'; ctx2.fillRect(0,0,2048,512);
  dirs.forEach((ang,i)=>{ human.rotation.y=ang; tmpRenderer.render(scene,camera); ctx2.drawImage(tmpCanvas,i*512,0,512,512); });
  const a=document.createElement('a'); a.download='sprites_3D_profundidad_4dir.png'; a.href=exportCanvas.toDataURL('image/png'); a.click();
};
function resize(){ renderer.setSize(canvas.clientWidth, canvas.clientHeight); camera.aspect=canvas.clientWidth/canvas.clientHeight; camera.updateProjectionMatrix(); }
window.addEventListener('resize', resize); resize();
</script>
</body>
</html>
