<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Editor RIGIDO - YAW PITCH GLOBAL + FIX</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:system-ui}
#top{background:#111;padding:8px;display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid #222}
input{width:100%;background:#1e1e1e;color:#fff;padding:8px;border-radius:6px;border:1px solid #333}
input[type=range]{padding:0}
button{padding:11px;border-radius:8px;border:0;font-weight:700;margin-top:5px;width:100%}
.primary{background:#00ff88;color:#000}.secondary{background:#7c5cff;color:#fff}.ghost{background:#222;color:#fff}
#canvasBox{width:100%;height:62vh;background:#000;display:flex;justify-content:center;align-items:center;touch-action:none;position:relative}
#c{max-width:100%;max-height:100%;touch-action:none}
#thumbs{display:flex;gap:6px;padding:6px;background:#111;overflow-x:auto}
.th{width:70px;height:70px;border:2px solid #333;border-radius:10px;overflow:hidden;position:relative;background:#000;flex-shrink:0}
.th.active{border-color:#00ff88}.th span{position:absolute;bottom:0;left:0;right:0;background:#000c;font-size:8px;text-align:center;padding:2px}
#panel{padding:8px;background:#111}
#status{background:#0a0a0a;padding:6px;border-radius:6px;font-size:11px;color:#00ff88;margin-bottom:5px;border:1px solid #1a1a1a}
#zoomInfo{position:absolute;top:10px;right:10px;background:#000c;color:#00ff88;padding:4px 8px;border-radius:12px;font-size:11px;border:1px solid #00ff88}
.row{display:flex;gap:6px;width:100%}
</style>
</head>
<body>
<div id="top">
<strong>RIGIDO - YAW PITCH GLOBAL</strong>
<input type="file" id="file" accept="image/*">
<div class="row"><button class="ghost" id="autoBone" style="width:50%">Auto calzar</button><button class="ghost" id="btnReset" style="width:50%">Reset T-Pose</button></div>
</div>
<div id="canvasBox"><canvas id="c" width="1024" height="1024"></canvas><div id="zoomInfo">Zoom 1.0x</div></div>
<div id="thumbs"></div>
<div id="panel">
<div id="status">1 frame 1x1/1x3/1x4 - YAW PITCH GLOBAL - 360° ON</div>
<label><input type="checkbox" id="showBones" checked> Esqueleto 3D</label>
<label><input type="checkbox" id="showFloor" checked> Piso 45°</label>
<label><input type="checkbox" id="showSprite" checked> Sprite base 0.15</label>
<label style="color:#ffeb7a"><input type="checkbox" id="autoZoomReturn"> Zoom vuelve solo</label>

<div style="background:#1a1a1a;padding:8px;border-radius:8px;margin:6px 0;border:1px solid #333">
<strong style="color:#ffeb7a">ROTACION GLOBAL SIN CAMBIAR POSTURA</strong>
<div class="row"><label style="width:50%">Yaw 360° <input type="range" id="yaw" min="0" max="360" value="0"><span id="yawVal">0°</span></label><label style="width:50%">Pitch <input type="range" id="pitch" min="-45" max="45" value="0"><span id="pitchVal">0°</span></label></div>
<button class="ghost" id="btnResetRot">Reset Rotacion</button>
</div>

<div class="row">
<button class="ghost" id="btnIdle" style="width:33%">T-Pose</button>
<button class="ghost" id="btnIdlePose" style="width:33%">IDLE</button>
<button class="ghost" id="btnWalkPose" style="width:33%">WALK</button>
</div>
<button class="ghost" id="btnFightPose">PELEA</button>
<div class="row">
<button class="ghost" id="btnCopy" style="width:50%">Copiar a 4 dirs</button>
<button class="ghost" id="btnZoomReset" style="width:50%">Zoom 1x</button>
</div>
<button class="primary" id="exportGreen">EXPORTAR VERDE 2048x512</button>
<button class="secondary" id="export">EXPORTAR ORIGINAL 8192x2048</button>
</div>
<canvas id="exportC" width="8192" height="2048" style="display:none"></canvas>
<canvas id="greenC" width="2048" height="512" style="display:none"></canvas>
<script>
const DIRS=['Front 0°','Front 45°','Side 90°','Back 135°'];
let srcImg=new Image(), frames=[], skeletons=[], baseSkeletons=[], cur=0, drag=null;
const c=document.getElementById('c'), ctx=c.getContext('2d');
const exportC=document.getElementById('exportC'), ectx=exportC.getContext('2d');
const greenC=document.getElementById('greenC'), gctx=greenC.getContext('2d');
const statusEl=document.getElementById('status');
const zoomInfo=document.getElementById('zoomInfo');
let globalYaw=0, globalPitch=0;
function log(m){statusEl.textContent=m;}
function getBounds(canvas){
  const w=canvas.width,h=canvas.height;
  const d=canvas.getContext('2d').getImageData(0,0,w,h).data;
  let minX=w,minY=h,maxX=0,maxY=0,f=false;
  for(let y=0;y<h;y+=3){for(let x=0;x<w;x+=3){let i=(y*w+x)*4; let a=d[i+3]; if(a>25){if(x<minX)minX=x; if(y<minY)minY=y; if(x>maxX)maxX=x; if(y>maxY)maxY=y; f=true;}}}
  if(!f) return {x:w*0.30,y:h*0.10,w:w*0.40,h:h*0.80};
  let pad=(maxX-minX)*0.06;
  return {x:Math.max(0,minX-pad), y:Math.max(0,minY-pad), w:Math.min(w,maxX+pad)-Math.max(0,minX-pad), h:Math.min(h,maxY+pad)-Math.max(0,minY-pad)};
}
function createRigidSkeleton(b, dir){
  const x=b.x,y=b.y,w=b.w,h=b.h;
  const P=(rx,ry)=>({x:x+rx*w, y:y+ry*h});
  let sk;
  if(dir===0) sk={hips:P(0.50,0.62), spine:P(0.50,0.50), chest:P(0.50,0.38), neck:P(0.50,0.30), head:P(0.50,0.15), l_sh:P(0.38,0.39), l_el:P(0.22,0.42), l_ha:P(0.10,0.45), r_sh:P(0.62,0.39), r_el:P(0.78,0.42), r_ha:P(0.90,0.45), l_hip:P(0.44,0.64), l_kn:P(0.39,0.81), l_ft:P(0.35,0.96), r_hip:P(0.56,0.64), r_kn:P(0.61,0.81), r_ft:P(0.65,0.96)};
  else if(dir===1) sk={hips:P(0.50,0.62), spine:P(0.50,0.50), chest:P(0.50,0.38), neck:P(0.51,0.30), head:P(0.52,0.15), l_sh:P(0.40,0.38), l_el:P(0.24,0.40), l_ha:P(0.12,0.42), r_sh:P(0.62,0.39), r_el:P(0.78,0.41), r_ha:P(0.88,0.43), l_hip:P(0.45,0.64), l_kn:P(0.41,0.81), l_ft:P(0.38,0.96), r_hip:P(0.55,0.64), r_kn:P(0.60,0.81), r_ft:P(0.63,0.96)};
  else if(dir===2) sk={hips:P(0.50,0.62), spine:P(0.50,0.50), chest:P(0.50,0.38), neck:P(0.52,0.30), head:P(0.54,0.15), l_sh:P(0.48,0.38), l_el:P(0.58,0.39), l_ha:P(0.68,0.40), r_sh:P(0.52,0.38), r_el:P(0.42,0.39), r_ha:P(0.34,0.40), l_hip:P(0.50,0.64), l_kn:P(0.54,0.81), l_ft:P(0.56,0.96), r_hip:P(0.48,0.64), r_kn:P(0.46,0.81), r_ft:P(0.44,0.96)};
  else sk={hips:P(0.50,0.62), spine:P(0.50,0.50), chest:P(0.50,0.38), neck:P(0.49,0.30), head:P(0.48,0.15), l_sh:P(0.40,0.38), l_el:P(0.26,0.40), l_ha:P(0.16,0.42), r_sh:P(0.60,0.39), r_el:P(0.72,0.40), r_ha:P(0.80,0.41), l_hip:P(0.45,0.64), l_kn:P(0.43,0.81), l_ft:P(0.41,0.96), r_hip:P(0.55,0.64), r_kn:P(0.57,0.81), r_ft:P(0.59,0.96)};
  function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
  sk._fixed={hips_spine:dist(sk.hips,sk.spine), spine_chest:dist(sk.spine,sk.chest), chest_neck:dist(sk.chest,sk.neck), neck_head:dist(sk.neck,sk.head), chest_l_sh:dist(sk.chest,sk.l_sh), chest_r_sh:dist(sk.chest,sk.r_sh), hips_l_hip:dist(sk.hips,sk.l_hip), hips_r_hip:dist(sk.hips,sk.r_hip), l_up:dist(sk.l_sh,sk.l_el), l_low:dist(sk.l_el,sk.l_ha), r_up:dist(sk.r_sh,sk.r_el), r_low:dist(sk.r_el,sk.r_ha), l_thigh:dist(sk.l_hip,sk.l_kn), l_shin:dist(sk.l_kn,sk.l_ft), r_thigh:dist(sk.r_hip,sk.r_kn), r_shin:dist(sk.r_kn,sk.r_ft)};
  return sk;
}
function slice(){
  frames=[]; skeletons=[]; baseSkeletons=[];
  let count=1;
  if(srcImg.width > srcImg.height * 1.2){
    count=Math.round(srcImg.width/srcImg.height);
    count=Math.max(1,Math.min(8,count));
  }
  let fw=srcImg.width/count, fh=srcImg.height;
  let baseCanvas=document.createElement('canvas');
  baseCanvas.width=fw; baseCanvas.height=fh;
  baseCanvas.getContext('2d').drawImage(srcImg,0,0,fw,fh,0,0,fw,fh);
  const b=getBounds(baseCanvas);
  for(let i=0;i<4;i++){
    frames.push({canvas:baseCanvas,b:b,w:fw,h:fh});
    let sk=createRigidSkeleton(b,i);
    skeletons.push(sk);
    baseSkeletons.push(JSON.parse(JSON.stringify(sk)));
  }
  buildThumbs(); cur=0; draw();
  log('Detectado '+count+' frames - frame 0 en 4 dirs - YAW/PITCH listo');
}
function applyGlobalRot(){
  if(!baseSkeletons.length) return;
  let yaw = globalYaw * Math.PI/180;
  let pitch = globalPitch * Math.PI/180;
  let cosYaw=Math.cos(yaw), cosPitch=Math.cos(pitch);
  for(let dir=0; dir<4; dir++){
    let base=baseSkeletons[dir];
    let sk=skeletons[dir];
    if(!base || !sk) continue;
    let cx=base.hips.x, cy=base.hips.y;
    for(let k in base){
      if(k.startsWith('_')) continue;
      let p=base[k];
      let dx=p.x-cx, dy=p.y-cy;
      sk[k].x = cx + dx * cosYaw;
      sk[k].y = cy + dy * cosPitch;
    }
  }
  document.getElementById('yawVal').textContent=globalYaw.toFixed(0)+'°';
  document.getElementById('pitchVal').textContent=globalPitch.toFixed(0)+'°';
  draw();
}
function buildThumbs(){const cont=document.getElementById('thumbs'); cont.innerHTML=''; frames.forEach((f,i)=>{const d=document.createElement('div'); d.className='th'+(i===cur?' active':''); const mini=document.createElement('canvas'); mini.width=70; mini.height=70; mini.getContext('2d').drawImage(f.canvas,0,0,f.w,f.h,5,5,60,60); d.appendChild(mini); const sp=document.createElement('span'); sp.textContent=DIRS[i]; d.appendChild(sp); d.onclick=()=>{cur=i; buildThumbs(); draw();}; cont.appendChild(d);});}
function solveLimb(shoulder, elbow, hand, target, lenUp, lenLow){
  let dx=target.x-shoulder.x, dy=target.y-shoulder.y; let d=Math.hypot(dx,dy); let maxD=lenUp+lenLow-1, minD=Math.abs(lenUp-lenLow)+1;
  if(d>maxD){d=maxD; let a=Math.atan2(dy,dx); target.x=shoulder.x+Math.cos(a)*d; target.y=shoulder.y+Math.sin(a)*d;}
  if(d<minD)d=minD;
  let a=Math.atan2(dy,dx); let cosA=(lenUp*lenUp + d*d - lenLow*lenLow)/(2*lenUp*d); cosA=Math.max(-1,Math.min(1,cosA)); let ang=Math.acos(cosA);
  elbow.x=shoulder.x + Math.cos(a+ang)*lenUp; elbow.y=shoulder.y + Math.sin(a+ang)*lenUp; hand.x=shoulder.x + Math.cos(a)*d; hand.y=shoulder.y + Math.sin(a)*d;
}
let view={ox:0,oy:0,w:0,h:0};
let zoomLevel=1;
let zoomTimeout=null;
let lastDist=0;
let lastTap=0;
function calcView(){
  const f=frames[cur]; if(!f) return;
  const s=Math.min((c.width*0.68)/f.w, (c.height*0.62)/f.h) * zoomLevel;
  const w=f.w*s, h=f.h*s;
  view={ox:(c.width-w)/2, oy:(c.height-h)/2 - c.height*0.06, w,h};
  zoomInfo.textContent='Zoom '+zoomLevel.toFixed(1)+'x';
}
function setZoom(z){
  zoomLevel=Math.max(0.4, Math.min(3.5, z));
  calcView(); draw();
  clearTimeout(zoomTimeout);
  const autoReturn = document.getElementById('autoZoomReturn').checked;
  if(!autoReturn) return;
  if(drag) return;
  if(Math.abs(zoomLevel-1)>0.02){
    zoomTimeout=setTimeout(()=>{
      if(drag) return;
      let start=zoomLevel; let startTime=Date.now(); let duration=450;
      function animateBack(){
        if(drag) return;
        let t=(Date.now()-startTime)/duration;
        if(t>=1){zoomLevel=1; calcView(); draw(); return;}
        let ease=1-Math.pow(1-t,3);
        zoomLevel=start + (1-start)*ease;
        calcView(); draw();
        requestAnimationFrame(animateBack);
      }
      animateBack();
    },2500);
  }
}
function worldToScreen(p){return {x: view.ox + (p.x/frames[cur].w)*view.w, y: view.oy + (p.y/frames[cur].h)*view.h};}
function screenToWorld(sx,sy){return {x: ((sx-view.ox)/view.w)*frames[cur].w, y: ((sy-view.oy)/view.h)*frames[cur].h};}
function getPos(e){const r=c.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:(t.clientX-r.left)*(c.width/r.width), y:(t.clientY-r.top)*(c.height/r.height)};}
function findJoint(x,y){
  const sk=skeletons[cur]; 
  let best=null, bestD=48; 
  for(let k in sk){ if(k.startsWith('_')) continue; if(['spine','chest','hips','neck'].includes(k)) continue; let p=sk[k]; let s=worldToScreen(p); let d=Math.hypot(x-s.x,y-s.y); if(d<bestD){bestD=d; best=k;} } 
  return best;
}
function startDrag(e){if(e.touches && e.touches.length===2) return; e.preventDefault(); clearTimeout(zoomTimeout); calcView(); const p=getPos(e); const j=findJoint(p.x,p.y); if(j) drag=j;}
function moveDrag(e){
  if(e.touches && e.touches.length===2) return;
  if(!drag) return; e.preventDefault();
  const p=getPos(e); const w=screenToWorld(p.x,p.y);
  const sk=skeletons[cur]; const base=baseSkeletons[cur]; const fix=sk._fixed;
  if(drag==='head'){ let a=Math.atan2(w.y-sk.neck.y, w.x-sk.neck.x); sk.head.x=sk.neck.x + Math.cos(a)*fix.neck_head; sk.head.y=sk.neck.y + Math.sin(a)*fix.neck_head; base.head.x=sk.head.x; base.head.y=sk.head.y;}
  else if(drag==='l_sh'){ let a=Math.atan2(w.y-sk.chest.y, w.x-sk.chest.x); sk.l_sh.x=sk.chest.x + Math.cos(a)*fix.chest_l_sh; sk.l_sh.y=sk.chest.y + Math.sin(a)*fix.chest_l_sh; base.l_sh.x=sk.l_sh.x; base.l_sh.y=sk.l_sh.y;}
  else if(drag==='r_sh'){ let a=Math.atan2(w.y-sk.chest.y, w.x-sk.chest.x); sk.r_sh.x=sk.chest.x + Math.cos(a)*fix.chest_r_sh; sk.r_sh.y=sk.chest.y + Math.sin(a)*fix.chest_r_sh; base.r_sh.x=sk.r_sh.x; base.r_sh.y=sk.r_sh.y;}
  else if(drag==='l_hip'){ let a=Math.atan2(w.y-sk.hips.y, w.x-sk.hips.x); sk.l_hip.x=sk.hips.x + Math.cos(a)*fix.hips_l_hip; sk.l_hip.y=sk.hips.y + Math.sin(a)*fix.hips_l_hip; base.l_hip.x=sk.l_hip.x; base.l_hip.y=sk.l_hip.y;}
  else if(drag==='r_hip'){ let a=Math.atan2(w.y-sk.hips.y, w.x-sk.hips.x); sk.r_hip.x=sk.hips.x + Math.cos(a)*fix.hips_r_hip; sk.r_hip.y=sk.hips.y + Math.sin(a)*fix.hips_r_hip; base.r_hip.x=sk.r_hip.x; base.r_hip.y=sk.r_hip.y;}
  else if(drag==='l_ha'){solveLimb(sk.l_sh, sk.l_el, sk.l_ha, w, fix.l_up, fix.l_low); base.l_el.x=sk.l_el.x; base.l_el.y=sk.l_el.y; base.l_ha.x=sk.l_ha.x; base.l_ha.y=sk.l_ha.y;}
  else if(drag==='r_ha'){solveLimb(sk.r_sh, sk.r_el, sk.r_ha, w, fix.r_up, fix.r_low); base.r_el.x=sk.r_el.x; base.r_el.y=sk.r_el.y; base.r_ha.x=sk.r_ha.x; base.r_ha.y=sk.r_ha.y;}
  else if(drag==='l_ft'){solveLimb(sk.l_hip, sk.l_kn, sk.l_ft, w, fix.l_thigh, fix.l_shin); base.l_kn.x=sk.l_kn.x; base.l_kn.y=sk.l_kn.y; base.l_ft.x=sk.l_ft.x; base.l_ft.y=sk.l_ft.y;}
  else if(drag==='r_ft'){solveLimb(sk.r_hip, sk.r_kn, sk.r_ft, w, fix.r_thigh, fix.r_shin); base.r_kn.x=sk.r_kn.x; base.r_kn.y=sk.r_kn.y; base.r_ft.x=sk.r_ft.x; base.r_ft.y=sk.r_ft.y;}
  else if(drag==='l_el'){ let a=Math.atan2(w.y-sk.l_sh.y, w.x-sk.l_sh.x); sk.l_el.x=sk.l_sh.x + Math.cos(a)*fix.l_up; sk.l_el.y=sk.l_sh.y + Math.sin(a)*fix.l_up; let dirX=sk.l_ha.x-sk.l_el.x, dirY=sk.l_ha.y-sk.l_el.y; let d=Math.hypot(dirX,dirY); if(d<2){dirX=Math.cos(a); dirY=Math.sin(a); d=1;} sk.l_ha.x=sk.l_el.x + (dirX/d)*fix.l_low; sk.l_ha.y=sk.l_el.y + (dirY/d)*fix.l_low; base.l_el.x=sk.l_el.x; base.l_el.y=sk.l_el.y; base.l_ha.x=sk.l_ha.x; base.l_ha.y=sk.l_ha.y;}
  else if(drag==='r_el'){ let a=Math.atan2(w.y-sk.r_sh.y, w.x-sk.r_sh.x); sk.r_el.x=sk.r_sh.x + Math.cos(a)*fix.r_up; sk.r_el.y=sk.r_sh.y + Math.sin(a)*fix.r_up; let dirX=sk.r_ha.x-sk.r_el.x, dirY=sk.r_ha.y-sk.r_el.y; let d=Math.hypot(dirX,dirY); if(d<2){dirX=Math.cos(a); dirY=Math.sin(a); d=1;} sk.r_ha.x=sk.r_el.x + (dirX/d)*fix.r_low; sk.r_ha.y=sk.r_el.y + (dirY/d)*fix.r_low; base.r_el.x=sk.r_el.x; base.r_el.y=sk.r_el.y; base.r_ha.x=sk.r_ha.x; base.r_ha.y=sk.r_ha.y;}
  else if(drag==='l_kn'){ let a=Math.atan2(w.y-sk.l_hip.y, w.x-sk.l_hip.x); sk.l_kn.x=sk.l_hip.x + Math.cos(a)*fix.l_thigh; sk.l_kn.y=sk.l_hip.y + Math.sin(a)*fix.l_thigh; let dirX=sk.l_ft.x-sk.l_kn.x, dirY=sk.l_ft.y-sk.l_kn.y; let d=Math.hypot(dirX,dirY); if(d<2){dirX=Math.cos(a); dirY=Math.sin(a); d=1;} sk.l_ft.x=sk.l_kn.x + (dirX/d)*fix.l_shin; sk.l_ft.y=sk.l_kn.y + (dirY/d)*fix.l_shin; base.l_kn.x=sk.l_kn.x; base.l_kn.y=sk.l_kn.y; base.l_ft.x=sk.l_ft.x; base.l_ft.y=sk.l_ft.y;}
  else if(drag==='r_kn'){ let a=Math.atan2(w.y-sk.r_hip.y, w.x-sk.r_hip.x); sk.r_kn.x=sk.r_hip.x + Math.cos(a)*fix.r_thigh; sk.r_kn.y=sk.r_hip.y + Math.sin(a)*fix.r_thigh; let dirX=sk.r_ft.x-sk.r_kn.x, dirY=sk.r_ft.y-sk.r_kn.y; let d=Math.hypot(dirX,dirY); if(d<2){dirX=Math.cos(a); dirY=Math.sin(a); d=1;} sk.r_ft.x=sk.r_kn.x + (dirX/d)*fix.r_shin; sk.r_ft.y=sk.r_kn.y + (dirY/d)*fix.r_shin; base.r_kn.x=sk.r_kn.x; base.r_kn.y=sk.r_kn.y; base.r_ft.x=sk.r_ft.x; base.r_ft.y=sk.r_ft.y;}
  draw();
}
function endDrag(e){ drag=null; lastDist=0; if(e && e.changedTouches && e.changedTouches.length===0){ let now=Date.now(); if(now-lastTap<300){ setZoom(1); } lastTap=now; } else if(!e.changedTouches){ setZoom(zoomLevel); } }
c.addEventListener('mousedown',startDrag); window.addEventListener('mousemove',moveDrag); window.addEventListener('mouseup',endDrag);
c.addEventListener('touchstart',(e)=>{ if(e.touches.length===2){ let dx=e.touches[0].clientX-e.touches[1].clientX; let dy=e.touches[0].clientY-e.touches[1].clientY; lastDist=Math.hypot(dx,dy); } else { startDrag(e); } },{passive:false});
c.addEventListener('touchmove',(e)=>{ if(e.touches.length===2){ e.preventDefault(); let dx=e.touches[0].clientX-e.touches[1].clientX; let dy=e.touches[0].clientY-e.touches[1].clientY; let dist=Math.hypot(dx,dy); if(lastDist>0){ setZoom(zoomLevel*(dist/lastDist)); } lastDist=dist; } else { moveDrag(e); } },{passive:false});
c.addEventListener('touchend', endDrag, {passive:false});
c.addEventListener('wheel',(e)=>{ e.preventDefault(); let delta=e.deltaY>0?0.92:1.08; setZoom(zoomLevel*delta); },{passive:false});
c.addEventListener('dblclick',()=>{setZoom(1);});
function drawFloor(){
  const W=c.width, H=c.height; const vx=W*0.5, vy=H*0.08, fy=H*0.70;
  ctx.save(); ctx.strokeStyle='#00ff55'; ctx.lineWidth=1; ctx.globalAlpha=0.85;
  for(let i=-20;i<=20;i++){let x=W*0.5 + i*(W*0.04); ctx.beginPath(); ctx.moveTo(x,H); ctx.lineTo(vx+i*1.2,vy); ctx.stroke();}
  for(let j=0;j<26;j++){let t=j/26; let y=fy+Math.pow(t,1.7)*(H-fy); let l=W*0.5 + (-20*W*0.04)*(1-(y-vy)/(H-vy)*0.88); let r=W*0.5 + (20*W*0.04)*(1-(y-vy)/(H-vy)*0.88); ctx.globalAlpha=0.15+t*0.45; ctx.beginPath(); ctx.moveTo(l,y); ctx.lineTo(r,y); ctx.stroke();}
  ctx.globalAlpha=1; ctx.fillStyle='#ff3333'; ctx.font='bold 13px monospace'; ctx.fillText('0°', vx-10, vy+16);
  ctx.strokeStyle='#00ff00'; ctx.lineWidth=2; ctx.globalAlpha=0.75; ctx.strokeRect(W*0.06, vy-8, W*0.88, H*0.80); ctx.restore();
}
function draw3DJoint(screenPos, radius, color, type){
  const scaleY = cur===2 ? 0.45 : cur===1 || cur===3 ? 0.75 : 1.0;
  ctx.save();
  ctx.translate(screenPos.x, screenPos.y);
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(1,2, radius*1.1, radius*1.1*scaleY, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.ellipse(0,0, radius, radius*scaleY, 0, 0, Math.PI*2); ctx.stroke();
  let grad = ctx.createRadialGradient(-radius*0.3, -radius*0.3*scaleY, radius*0.2, 0,0, radius);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.3, color);
  grad.addColorStop(1, '#000000');
  ctx.fillStyle=grad;
  ctx.beginPath(); ctx.ellipse(0,0, radius*0.85, radius*0.85*scaleY, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.8)';
  ctx.beginPath(); ctx.ellipse(-radius*0.25, -radius*0.25*scaleY, radius*0.25, radius*0.25*scaleY, 0,0,Math.PI*2); ctx.fill();
  if(type==='shoulder' || type==='hip'){
    ctx.strokeStyle= type==='shoulder' ? '#ffeb7a' : '#7c5cff';
    ctx.lineWidth=1; ctx.globalAlpha=0.6; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.ellipse(0,0, radius*1.6, radius*1.6*scaleY, 0,0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
}
function draw(){
  if(!frames[cur]){ctx.fillStyle='#000'; ctx.fillRect(0,0,c.width,c.height); if(document.getElementById('showFloor').checked) drawFloor(); return;}
  calcView(); ctx.fillStyle='#000'; ctx.fillRect(0,0,c.width,c.height);
  if(document.getElementById('showFloor').checked) drawFloor();
  const sk=skeletons[cur]; const f=frames[cur];
  function seg(a,b,thick,color){const A=worldToScreen(a), B=worldToScreen(b); const len=Math.hypot(B.x-A.x,B.y-A.y), ang=Math.atan2(B.y-A.y,B.x-A.x); ctx.save(); ctx.translate(A.x,A.y); ctx.rotate(ang); ctx.fillStyle=color; ctx.beginPath(); ctx.roundRect(0,-thick/2,len,thick,thick/2); ctx.fill(); ctx.restore();}
  if(document.getElementById('showSprite').checked){ctx.globalAlpha=0.15; ctx.drawImage(f.canvas,0,0,f.w,f.h,view.ox,view.oy,view.w,view.h); ctx.globalAlpha=1;}
  const white='#e8e8e8', spineCol='#ffffff', neckCol='#ffeb7a';
  seg(sk.hips, sk.spine, view.w*0.085, spineCol); seg(sk.spine, sk.chest, view.w*0.10, spineCol); seg(sk.chest, sk.neck, view.w*0.065, neckCol); seg(sk.neck, sk.head, view.w*0.11, white);
  seg(sk.l_sh, sk.l_el, view.w*0.060, white); seg(sk.l_el, sk.l_ha, view.w*0.050, white);
  seg(sk.r_sh, sk.r_el, view.w*0.060, white); seg(sk.r_el, sk.r_ha, view.w*0.050, white);
  seg(sk.l_hip, sk.l_kn, view.w*0.070, white); seg(sk.l_kn, sk.l_ft, view.w*0.060, white);
  seg(sk.r_hip, sk.r_kn, view.w*0.070, white); seg(sk.r_kn, sk.r_ft, view.w*0.060, white);
  seg(sk.chest, sk.l_sh, view.w*0.04, '#ffeb7a'); seg(sk.chest, sk.r_sh, view.w*0.04, '#ffeb7a');
  seg(sk.hips, sk.l_hip, view.w*0.04, '#7c5cff'); seg(sk.hips, sk.r_hip, view.w*0.04, '#7c5cff');
  if(document.getElementById('showBones').checked){
    for(let k in sk){ if(k.startsWith('_')) continue;
      const p=worldToScreen(sk[k]);
      let isRed=k.includes('ha')||k.includes('ft');
      let isShoulder=k.includes('_sh');
      let isHip=k.includes('_hip');
      let col=isRed?'#ff4a6a':isShoulder?'#ffeb7a':isHip?'#7c5cff':k==='head'?'#ffffff':'#6cf2ff';
      let rad= isShoulder||isHip ? 9 : isRed ? 7 : 6;
      let type= isShoulder ? 'shoulder' : isHip ? 'hip' : 'joint';
      draw3DJoint(p, rad, col, type);
    }
    const chestS=worldToScreen(sk.chest);
    const hipsS=worldToScreen(sk.hips);
    ctx.save(); ctx.fillStyle='#ffeb7a'; ctx.globalAlpha=0.3; ctx.beginPath(); ctx.arc(chestS.x,chestS.y,18,0,Math.PI*2); ctx.fill(); ctx.restore();
    ctx.save(); ctx.fillStyle='#7c5cff'; ctx.globalAlpha=0.3; ctx.beginPath(); ctx.arc(hipsS.x,hipsS.y,18,0,Math.PI*2); ctx.fill(); ctx.restore();
  }
}
function applyPreset(type){
  if(!frames[cur]) return;
  const sk=skeletons[cur]; const base=baseSkeletons[cur]; const b=frames[cur].b;
  if(type==='idle'){ sk.l_sh.x=b.x+b.w*0.40; sk.l_el.x=b.x+b.w*0.32; sk.l_el.y=b.y+b.h*0.55; sk.l_ha.x=b.x+b.w*0.28; sk.l_ha.y=b.y+b.h*0.66; sk.r_sh.x=b.x+b.w*0.60; sk.r_el.x=b.x+b.w*0.68; sk.r_el.y=b.y+b.h*0.55; sk.r_ha.x=b.x+b.w*0.72; sk.r_ha.y=b.y+b.h*0.66; }
  else if(type==='walk'){ sk.l_kn.x=b.x+b.w*0.32; sk.l_kn.y=b.y+b.h*0.78; sk.l_ft.x=b.x+b.w*0.22; sk.l_ft.y=b.y+b.h*0.94; sk.r_kn.x=b.x+b.w*0.68; sk.r_kn.y=b.y+b.h*0.82; sk.r_ft.x=b.x+b.w*0.78; sk.r_ft.y=b.y+b.h*0.95; }
  else if(type==='fight'){ sk.l_el.x=b.x+b.w*0.32; sk.l_el.y=b.y+b.h*0.47; sk.l_ha.x=b.x+b.w*0.34; sk.l_ha.y=b.y+b.h*0.53; sk.r_el.x=b.x+b.w*0.68; sk.r_el.y=b.y+b.h*0.49; sk.r_ha.x=b.x+b.w*0.64; sk.r_ha.y=b.y+b.h*0.55; sk.l_kn.x=b.x+b.w*0.34; sk.l_kn.y=b.y+b.h*0.76; sk.l_ft.x=b.x+b.w*0.26; sk.l_ft.y=b.y+b.h*0.93; sk.r_kn.x=b.x+b.w*0.66; sk.r_kn.y=b.y+b.h*0.80; sk.r_ft.x=b.x+b.w*0.76; sk.r_ft.y=b.y+b.h*0.94; }
  for(let k in sk){ if(k.startsWith('_')) continue; base[k].x=sk[k].x; base[k].y=sk[k].y; }
  applyGlobalRot();
}
function renderGreenStrip(){
  greenC.width=2048; greenC.height=512; 
  gctx.fillStyle='#00c800'; 
  gctx.fillRect(0,0,2048,512);
  for(let dir=0; dir<4; dir++){
    let sk=skeletons[dir]; 
    let f=frames[dir]; 
    if(!sk || !f) continue; 
    let offX=dir*512;
    let s=Math.min((512*0.68)/f.w, (512*0.62)/f.h);
    let vw=f.w*s, vh=f.h*s;
    let ox=offX + (512 - vw)/2;
    let oy=(512 - vh)/2 - 512*0.06;
    function w2s(p){ return {x: ox + (p.x/f.w)*vw, y: oy + (p.y/f.h)*vh}; }
    function seg(a,b,thick,col){
      let A=w2s(a), B=w2s(b); 
      let len=Math.hypot(B.x-A.x,B.y-A.y), ang=Math.atan2(B.y-A.y,B.x-A.x); 
      gctx.save(); gctx.translate(A.x,A.y); gctx.rotate(ang); 
      gctx.fillStyle=col; gctx.beginPath(); gctx.roundRect(0,-thick/2,len,thick,thick/2); gctx.fill(); 
      gctx.restore();
    }
    let white='#e8e8e8';
    seg(sk.hips, sk.spine, vw*0.085, white); 
    seg(sk.spine, sk.chest, vw*0.10, white); 
    seg(sk.chest, sk.neck, vw*0.065, '#ffeb7a'); 
    seg(sk.neck, sk.head, vw*0.11, white);
    seg(sk.l_sh, sk.l_el, vw*0.060, white); seg(sk.l_el, sk.l_ha, vw*0.050, white);
    seg(sk.r_sh, sk.r_el, vw*0.060, white); seg(sk.r_el, sk.r_ha, vw*0.050, white);
    seg(sk.l_hip, sk.l_kn, vw*0.070, white); seg(sk.l_kn, sk.l_ft, vw*0.060, white);
    seg(sk.r_hip, sk.r_kn, vw*0.070, white); seg(sk.r_kn, sk.r_ft, vw*0.060, white);
  }
}
document.getElementById('file').addEventListener('change',e=>{const file=e.target.files[0]; if(!file) return; const url=URL.createObjectURL(file); srcImg=new Image(); srcImg.onload=()=>{slice();}; srcImg.src=url;});
document.getElementById('autoBone').onclick=()=>{if(!frames[cur]) return; skeletons[cur]=createRigidSkeleton(frames[cur].b,cur); baseSkeletons[cur]=JSON.parse(JSON.stringify(skeletons[cur])); draw();};
document.getElementById('btnReset').onclick=()=>{if(!frames[cur]) return; skeletons[cur]=createRigidSkeleton(frames[cur].b,cur); baseSkeletons[cur]=JSON.parse(JSON.stringify(skeletons[cur])); applyGlobalRot();};
document.getElementById('btnIdle').onclick=()=>{for(let i=0;i<4;i++){skeletons[i]=createRigidSkeleton(frames[i].b,i); baseSkeletons[i]=JSON.parse(JSON.stringify(skeletons[i]));} cur=0; buildThumbs(); applyGlobalRot();};
document.getElementById('btnIdlePose').onclick=()=>{applyPreset('idle');};
document.getElementById('btnWalkPose').onclick=()=>{applyPreset('walk');};
document.getElementById('btnFightPose').onclick=()=>{applyPreset('fight');};
document.getElementById('btnCopy').onclick=()=>{if(!frames[cur]) return; let base=skeletons[cur]; let base0=baseSkeletons[cur]; for(let i=0;i<4;i++){ if(i===cur) continue; let nb=frames[i].b, ob=frames[cur].b; function mapP(p){ let rx=(p.x-ob.x)/ob.w, ry=(p.y-ob.y)/ob.h; return {x: nb.x+rx*nb.w, y: nb.y+ry*nb.h}; } let ns={}; let ns0={}; for(let k in base){ if(k.startsWith('_')) continue; ns[k]=mapP(base[k]); ns0[k]=mapP(base0[k]); } ns._fixed=base._fixed; ns0._fixed=base0._fixed; skeletons[i]=ns; baseSkeletons[i]=ns0; } draw();};
document.getElementById('btnZoomReset').onclick=()=>{setZoom(1);};
document.getElementById('yaw').oninput=e=>{globalYaw=parseFloat(e.target.value); applyGlobalRot();};
document.getElementById('pitch').oninput=e=>{globalPitch=parseFloat(e.target.value); applyGlobalRot();};
document.getElementById('btnResetRot').onclick=()=>{globalYaw=0; globalPitch=0; document.getElementById('yaw').value=0; document.getElementById('pitch').value=0; applyGlobalRot();};
document.getElementById('export').onclick=()=>{ectx.clearRect(0,0,8192,2048); frames.forEach((f,i)=>{ectx.drawImage(f.canvas,0,0,f.w,f.h,i*2048,0,2048,2048);}); const a=document.createElement('a'); a.download='original_8192.png'; a.href=exportC.toDataURL('image/png'); a.click();};
document.getElementById('exportGreen').onclick=()=>{renderGreenStrip(); const a=document.createElement('a'); a.download='rigido_verde_4dir.png'; a.href=greenC.toDataURL('image/png'); a.click();};
draw();
</script>
