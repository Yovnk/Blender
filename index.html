<title>GameLab - 4 Frames Bone Editor 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#fff;font-family:Inter,system-ui;display:flex;flex-direction:column;height:100vh}

label{font-size:11px;color:#aaa;margin-top:10px;display:block}small{color:#666}
.frameThumb{width:68px;height:68px;border:2px solid #333;border-radius:8px;margin:4px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;background:#000}

</style>

<div id="top">
<strong>BONE EDITOR 4 FRAMES</strong>
<input type="file" id="file" accept="image/*" style="max-width:220px">

</div>

<button class="primary" id="export">EXPORTAR Spritesheet 8192x2048 strip4.png</button>
<button class="ghost" id="exportJSON">Guardar huesos JSON</button>
<small id="status">Sube tu imagen maniqui</small>
</div>
<div id="center">
<div id="canvasBox"><canvas id="c" width="900" height="700"></canvas></div>
</div>
